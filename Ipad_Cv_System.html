<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0f172a]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CV Viewer Portal - Manpower Agency</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons (Lucide Icon Equivalents) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Horizontal Snap Scroll Carousel */
    .snap-gallery {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .snap-slide {
      scroll-snap-align: center;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans antialiased selection:bg-[#007aff] selection:text-white">

  <!-- ================= HEADER SECTION ================= -->
  <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur-lg border-b border-white/10">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between gap-4 mb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-[#007aff] flex items-center justify-center shrink-0 shadow-lg shadow-[#007aff]/20">
            <i class="fa-regular fa-folder-open text-white text-base"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold leading-tight">CV Viewer Portal</h1>
            <p class="text-white/50 text-xs">Manpower Agency</p>
          </div>
        </div>
        
        <span id="totalBadge" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#1e293b] border border-white/10 text-white/80 hidden">
          <span id="totalCount">0</span> Total CVs
        </span>
      </div>

      <!-- Search Box -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-white/40 text-sm"></i>
        <input
          type="text"
          id="searchInput"
          oninput="handleSearch()"
          placeholder="Search folders (role, country, type)…"
          class="w-full bg-[#1e293b] border border-white/10 focus:border-[#007aff] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder:text-white/40 outline-none transition-colors"
        />
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT BODY ================= -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 pb-16">
    
    <!-- Loading Spinner -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-24 text-white/50">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 text-[#007aff]"></i>
      <p class="text-sm">Loading CVs…</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden flex flex-col items-center justify-center py-24 text-center">
      <p class="text-red-400 text-sm font-medium mb-1">Something went wrong</p>
      <p id="errorText" class="text-white/50 text-xs"></p>
    </div>

    <!-- Empty Search State -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-white/50">
      <p id="emptyText" class="text-sm">No folders match your search.</p>
    </div>

    <!-- Folders Sections Container -->
    <div id="sectionsContainer" class="space-y-8 hidden">
      <!-- Housemaid Types -->
      <section id="sec-housemaid">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-white/60">Housemaid Types</h2>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>
        <div id="grid-housemaid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>

      <!-- Job Roles -->
      <section id="sec-jobs">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-white/60">Job Roles</h2>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>
        <div id="grid-jobs" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>

      <!-- Countries -->
      <section id="sec-countries">
        <div class="flex items-center gap-2 mb-3">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-white/60">Countries</h2>
          <div class="flex-1 h-px bg-white/10"></div>
        </div>
        <div id="grid-countries" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>
    </div>

  </main>

  <!-- ================= CV VIEWER OVERLAY MODAL ================= -->
  <div id="cvViewerModal" class="fixed inset-0 z-50 bg-[#0f172a] hidden flex-col">
    <!-- Top Bar -->
    <div class="flex items-center gap-3 px-3 sm:px-4 h-14 border-b border-white/10 bg-[#1e293b] shrink-0">
      <button
        onclick="closeCVViewer()"
        className="flex items-center gap-1.5 text-white/80 hover:text-white text-sm font-medium px-2 py-1.5 rounded-lg hover:bg-white/5 transition-colors"
        class="flex items-center gap-1.5 text-white/80 hover:text-white text-sm font-medium px-2 py-1.5 rounded-lg hover:bg-white/5 transition-colors"
      >
        <i class="fa-solid fa-arrow-left text-base"></i>
        <span class="hidden sm:inline">Back to Folders</span>
      </button>

      <div class="flex-1 min-w-0 text-center">
        <span id="viewerTitle" class="text-white font-semibold text-sm sm:text-base truncate block"></span>
      </div>

      <span id="viewerBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-[#007aff] text-white shrink-0">
        0 CVs
      </span>
    </div>

    <!-- Horizontal Side-Scroll Gallery -->
    <div class="flex-1 overflow-x-auto overflow-y-hidden snap-gallery">
      <div id="viewerSlidesContainer" class="flex gap-3 sm:gap-5 p-3 sm:p-5 h-full">
        <!-- Candidate CV slides injected dynamically here -->
      </div>
    </div>
  </div>

  <!-- ================= JAVASCRIPT CODE ================= -->
  <script>
    const SUPABASE_URL = "https://ksyxmoqzcghszrhlpaxh.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_U289_qf4pkGHp-G1C4kX5w_2bztcmOg";

    const JOB_LABELS = {
      "House Maid": "Housemaid",
      "Baby sitting": "Baby Sitter",
      "Domestic Worker": "Domestic Worker",
      "Driver": "Driver",
      "Cook": "Cook",
      "Nurse": "Nurse"
    };

    let talents = [];
    let activeFolder = null;

    // Fetch talents data on initialization
    async function fetchTalentsData() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/talents?select=*&order=created_at.desc`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        });

        if (!res.ok) throw new Error(`HTTP error: ${res.status}`);

        talents = await res.json();

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('totalCount').innerText = talents.length;
        document.getElementById('totalBadge').classList.remove('hidden');
        document.getElementById('sectionsContainer').classList.remove('hidden');

        renderUI();
      } catch (err) {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorText').innerText = err.message;
        document.getElementById('errorState').classList.remove('hidden');
      }
    }

    // Build categories structure dynamically
    function getSections() {
      const housemaidTypes = [
        {
          id: "recruitment",
          label: "Recruitment Housemaids",
          icon: "fa-users",
          talents: talents.filter((t) => t.workerType === "Recruitment Workers")
        },
        {
          id: "returned",
          label: "Returned Housemaids",
          icon: "fa-users",
          talents: talents.filter((t) => t.workerType === "Returned Housemaids")
        }
      ];

      const jobs = [...new Set(talents.map((t) => t.job).filter(Boolean))].sort();
      const jobRoles = jobs.map((j) => ({
        id: `job-${j}`,
        label: JOB_LABELS[j] || j,
        icon: "fa-briefcase",
        talents: talents.filter((t) => t.job === j)
      }));

      const countries = [...new Set(talents.map((t) => t.country).filter(Boolean))].sort();
      const countryFolders = countries.map((c) => ({
        id: `country-${c}`,
        label: c,
        icon: "fa-globe",
        talents: talents.filter((t) => t.country === c)
      }));

      return [
        { id: "housemaid", title: "Housemaid Types", folders: housemaidTypes },
        { id: "jobs", title: "Job Roles", folders: jobRoles },
        { id: "countries", title: "Countries", folders: countryFolders }
      ];
    }

    // Render Folder Cards (exact replication of FolderCard.jsx)
    function renderUI() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sections = getSections();
      let totalVisibleFolders = 0;

      sections.forEach((sec) => {
        const gridEl = document.getElementById(`grid-${sec.id}`);
        const secEl = document.getElementById(`sec-${sec.id}`);
        gridEl.innerHTML = "";

        const filteredFolders = sec.folders.filter(f => f.label.toLowerCase().includes(query));

        if (filteredFolders.length > 0) {
          secEl.classList.remove('hidden');
          totalVisibleFolders += filteredFolders.length;

          filteredFolders.forEach((folder) => {
            const count = folder.talents.length;
            const cardBtn = document.createElement('button');
            cardBtn.className = "group relative flex items-center gap-3 p-4 rounded-2xl bg-[#1e293b] hover:bg-[#29394d] border border-white/5 hover:border-[#007aff]/40 transition-all duration-200 text-left active:scale-[0.98]";
            
            cardBtn.onclick = () => openCVViewer(folder);

            cardBtn.innerHTML = `
              <div class="flex items-center justify-center w-11 h-11 rounded-xl bg-[#007aff]/15 text-[#007aff] shrink-0 group-hover:bg-[#007aff]/25 transition-colors">
                <i class="fa-solid ${folder.icon} text-lg"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-white font-semibold text-sm truncate">${folder.label}</p>
                <p class="text-white/50 text-xs mt-0.5">${count} CV${count !== 1 ? 's' : ''} available</p>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-[#007aff] text-white shrink-0">
                ${count}
              </span>
              <i class="fa-solid fa-chevron-right w-4 h-4 text-white/30 group-hover:text-white/70 group-hover:translate-x-0.5 transition-all text-xs flex items-center justify-center"></i>
            `;
            gridEl.appendChild(cardBtn);
          });
        } else {
          secEl.classList.add('hidden');
        }
      });

      const emptyEl = document.getElementById('emptyState');
      if (totalVisibleFolders === 0 && query !== "") {
        document.getElementById('emptyText').innerText = `No folders match "${query}".`;
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
      }
    }

    function handleSearch() {
      renderUI();
    }

    // Open CV Viewer (exact replication of CVViewer.jsx)
    function openCVViewer(folder) {
      activeFolder = folder;
      const { label, talents: folderTalents } = folder;

      document.getElementById('viewerTitle').innerText = label;
      document.getElementById('viewerBadge').innerText = `${folderTalents.length} CVs`;

      const slidesContainer = document.getElementById('viewerSlidesContainer');
      slidesContainer.innerHTML = '';

      if (folderTalents.length === 0) {
        slidesContainer.innerHTML = `
          <div class="w-full h-full flex items-center justify-center text-white/50 text-sm">
            No CVs available in this folder.
          </div>
        `;
      } else {
        folderTalents.forEach((t, i) => {
          const slide = document.createElement('div');
          slide.className = "snap-slide shrink-0 w-full sm:w-[78%] lg:w-[58%] xl:w-[46%] h-full flex flex-col";

          slide.innerHTML = `
            <div class="relative flex-1 min-h-0 bg-black rounded-2xl overflow-hidden border border-white/10 flex items-center justify-center">
              ${t.cv ? `
                <img
                  src="${t.cv}"
                  alt="${t.name || 'Candidate CV'}"
                  loading="${i < 2 ? 'eager' : 'lazy'}"
                  class="max-w-full max-h-full w-auto h-auto object-contain"
                  onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'text-white/40 text-xs p-4 text-center\\'>Unable to preview image directly.<br/><a href=\\'${t.cv}\\' target=\\'_blank\\' class=\\'text-[#007aff] underline mt-2 inline-block\\'>Click here to view PDF</a></div>';"
                />
              ` : `
                <div class="text-white/40 text-xs">No CV file provided</div>
              `}

              <!-- Counter Badge -->
              <span class="absolute top-2.5 right-2.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-black/70 text-white backdrop-blur-sm">
                ${i + 1} / ${folderTalents.length}
              </span>

              <!-- Open Original Button -->
              ${t.cv ? `
                <a
                  href="${t.cv}"
                  target="_blank"
                  rel="noreferrer"
                  class="absolute top-2.5 left-2.5 flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full bg-[#007aff] text-white hover:opacity-90 transition-opacity"
                >
                  <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>
                  Open Original
                </a>
              ` : ''}
            </div>

            <!-- Candidate Info Footer -->
            <div class="mt-2.5 px-1 shrink-0">
              <p class="text-white text-sm font-semibold truncate">${t.name || 'Unnamed Candidate'}</p>
              <p class="text-white/55 text-xs truncate">
                ${t.job || 'No Job Specified'} • ${t.experience || 'N/A'} • ${t.country || 'N/A'}
              </p>
            </div>
          `;

          slidesContainer.appendChild(slide);
        });
      }

      const modal = document.getElementById('cvViewerModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = "hidden";
    }

    // Close Modal
    function closeCVViewer() {
      activeFolder = null;
      const modal = document.getElementById('cvViewerModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = "";
      document.getElementById('viewerSlidesContainer').innerHTML = '';
    }

    // Escape Key Listener
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && activeFolder) {
        closeCVViewer();
      }
    });

    // Run on startup
    window.onload = fetchTalentsData;
  </script>
</body>
</html>
