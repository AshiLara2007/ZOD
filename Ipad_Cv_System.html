<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CV Viewer Portal - Manpower Agency</title>

  <!-- FontAwesome Icons for Old Browsers -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* Global Reset & Pure CSS Theme Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Header Styling */
    header {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
    }
    .header-container {
      max-width: 1024px;
      margin: 0 auto;
    }
    .header-top {
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .logo-area {
      display: -webkit-flex;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background-color: #007aff;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 18px;
    }
    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9999px;
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
    }

    /* Search Input */
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      -webkit-transform: translateY(-50%);
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
    }
    .search-input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px 10px 40px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
    }
    .search-input:focus {
      border-color: #007aff;
    }

    /* Main Container & Sections */
    main {
      max-width: 1024px;
      margin: 0 auto;
      padding: 24px 16px 64px 16px;
    }
    .section-title-wrap {
      display: -webkit-flex;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
    }
    .divider {
      -webkit-flex: 1;
      flex: 1;
      height: 1px;
      background-color: rgba(255, 255, 255, 0.1);
    }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    @media (min-width: 640px) {
      .folder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .folder-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    /* Folder Card Styling */
    .folder-card {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: #ffffff;
    }
    .folder-card:hover, .folder-card:active {
      background-color: #29394d;
      border-color: rgba(0, 122, 255, 0.4);
    }
    .folder-left {
      display: -webkit-flex;
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }
    .folder-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: rgba(0, 122, 255, 0.15);
      color: #007aff;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      -webkit-shrink: 0;
      flex-shrink: 0;
    }
    .folder-text h3 {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .folder-text p {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2px;
    }
    .count-badge {
      background-color: #007aff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-right: 8px;
    }

    /* CV Viewer Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 50;
      background-color: #0f172a;
      display: none;
      -webkit-flex-direction: column;
      flex-direction: column;
    }
    .modal-header {
      height: 56px;
      background-color: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 16px;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: space-between;
      -webkit-shrink: 0;
      flex-shrink: 0;
    }
    .back-btn {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Horizontal Side-Scroll Gallery */
    .slides-viewport {
      -webkit-flex: 1;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      display: -webkit-flex;
      display: flex;
      gap: 16px;
      align-items: center;
      scroll-snap-type: x mandatory;
      -webkit-scroll-snap-type: mandatory;
    }
    .cv-slide {
      -webkit-shrink: 0;
      flex-shrink: 0;
      width: 85vw;
      max-width: 650px;
      height: 100%;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      scroll-snap-align: center;
      -webkit-scroll-snap-align: center;
    }
    .cv-frame {
      position: relative;
      -webkit-flex: 1;
      flex: 1;
      background-color: #000000;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      display: -webkit-flex;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cv-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .counter-tag {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .open-btn {
      position: absolute;
      top: 10px; left: 10px;
      background: #007aff;
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
    }

    /* Helper Utilities */
    .hidden { display: none !important; }
    .flex { display: -webkit-flex !important; display: flex !important; }
    .center-box { text-align: center; padding: 60px 16px; color: rgba(255, 255, 255, 0.5); }
  </style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header>
    <div class="header-container">
      <div class="header-top">
        <div class="logo-area">
          <div class="logo-icon">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <div>
            <h1 style="font-size: 18px; font-weight: 700;">CV Viewer Portal</h1>
            <p style="font-size: 12px; color: rgba(255,255,255,0.5);">Manpower Agency</p>
          </div>
        </div>
        <span id="totalBadge" class="badge hidden">
          <span id="totalCount">0</span> Total CVs
        </span>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input
          type="text"
          id="searchInput"
          onkeyup="handleSearch()"
          oninput="handleSearch()"
          placeholder="Search folders (role, country, type)..."
          class="search-input"
        />
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main>
    <div id="loadingState" class="center-box">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 24px; color: #007aff; margin-bottom: 8px;"></i>
      <p>Loading Candidates & CVs...</p>
    </div>

    <div id="errorState" class="center-box hidden" style="color: #f87171;">
      <p id="errorText">Failed to load data from server.</p>
    </div>

    <div id="emptyState" class="center-box hidden">
      <p id="emptyText">No folders found matching your search.</p>
    </div>

    <div id="sectionsContainer" class="hidden">
      <!-- Housemaid Types -->
      <div id="sec-housemaid">
        <div class="section-title-wrap">
          <span class="section-title">Housemaid Types</span>
          <div class="divider"></div>
        </div>
        <div id="grid-housemaid" class="folder-grid"></div>
      </div>

      <!-- Job Roles -->
      <div id="sec-jobs">
        <div class="section-title-wrap">
          <span class="section-title">Job Roles</span>
          <div class="divider"></div>
        </div>
        <div id="grid-jobs" class="folder-grid"></div>
      </div>

      <!-- Countries -->
      <div id="sec-countries">
        <div class="section-title-wrap">
          <span class="section-title">Countries</span>
          <div class="divider"></div>
        </div>
        <div id="grid-countries" class="folder-grid"></div>
      </div>
    </div>
  </main>

  <!-- ================= CV VIEWER MODAL ================= -->
  <div id="cvViewerModal" class="modal-overlay">
    <div class="modal-header">
      <button onclick="closeCVViewer()" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <div style="text-align: center;">
        <span id="viewerTitle" style="font-weight: 600; font-size: 15px; display: block;"></span>
      </div>
      <span id="viewerBadge" class="count-badge">0 CVs</span>
    </div>

    <div id="viewerSlidesContainer" class="slides-viewport">
      <!-- CV Slides injected via JS -->
    </div>
  </div>

  <!-- ================= OLD IPAD COMPATIBLE JS ================= -->
  <script>
    var SUPABASE_URL = "https://ksyxmoqzcghszrhlpaxh.supabase.co"; 
    var SUPABASE_KEY = "sb_publishable_U289_qf4pkGHp-G1C4kX5w_2bztcmOg";

    var JOB_LABELS = {
      "House Maid": "Housemaid",
      "Baby sitting": "Baby Sitter",
      "Domestic Worker": "Domestic Worker",
      "Driver": "Driver",
      "Cook": "Cook",
      "Nurse": "Nurse"
    };

    var talents = [];

    // Old iPad Compatible XMLHttpRequest (No Fetch API Dependency)
    function loadData() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", SUPABASE_URL + "/rest/v1/talents?select=*&order=created_at.desc", true);
      xhr.setRequestHeader("apikey", SUPABASE_KEY);
      xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_KEY);

      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            talents = JSON.parse(xhr.responseText);
            document.getElementById("loadingState").className += " hidden";
            document.getElementById("totalCount").innerText = talents.length;
            document.getElementById("totalBadge").className = "badge";
            document.getElementById("sectionsContainer").className = "";
            renderFolders();
          } catch(e) {
            showErr("Data parsing error: " + e.message);
          }
        } else {
          showErr("Database Connection Error (Code: " + xhr.status + ")");
        }
      };

      xhr.onerror = function() {
        showErr("Network Error. Please check your internet connection.");
      };

      xhr.send();
    }

    function showErr(msg) {
      document.getElementById("loadingState").className += " hidden";
      document.getElementById("errorText").innerText = msg;
      document.getElementById("errorState").className = "center-box";
    }

    function getUnique(arr, key) {
      var map = {}, out = [];
      for (var i = 0; i < arr.length; i++) {
        var val = arr[i][key];
        if (val && !map[val]) {
          map[val] = true;
          out.push(val);
        }
      }
      return out.sort();
    }

    function buildData() {
      var housemaids = [
        {
          label: "Recruitment Housemaids",
          icon: "fa-users",
          talents: talents.filter(function(t) { return t.workerType === "Recruitment Workers"; })
        },
        {
          label: "Returned Housemaids",
          icon: "fa-users",
          talents: talents.filter(function(t) { return t.workerType === "Returned Housemaids"; })
        }
      ];

      var jobs = getUnique(talents, 'job').map(function(j) {
        return {
          label: JOB_LABELS[j] || j,
          icon: "fa-briefcase",
          talents: talents.filter(function(t) { return t.job === j; })
        };
      });

      var countries = getUnique(talents, 'country').map(function(c) {
        return {
          label: c,
          icon: "fa-globe",
          talents: talents.filter(function(t) { return t.country === c; })
        };
      });

      return [
        { id: "housemaid", folders: housemaids },
        { id: "jobs", folders: jobs },
        { id: "countries", folders: countries }
      ];
    }

    function renderFolders() {
      var q = document.getElementById("searchInput").value.toLowerCase().trim();
      var sections = buildData();
      var visibleTotal = 0;

      for (var i = 0; i < sections.length; i++) {
        var sec = sections[i];
        var grid = document.getElementById("grid-" + sec.id);
        var secDiv = document.getElementById("sec-" + sec.id);
        grid.innerHTML = "";

        var matches = sec.folders.filter(function(f) {
          return f.label.toLowerCase().indexOf(q) !== -1;
        });

        if (matches.length > 0) {
          secDiv.className = "";
          visibleTotal += matches.length;

          for (var j = 0; j < matches.length; j++) {
            var f = matches[j];
            var btn = document.createElement("button");
            btn.className = "folder-card";
            btn.onclick = (function(folderData) {
              return function() { openCVViewer(folderData); };
            })(f);

            btn.innerHTML = 
              '<div class="folder-left">' +
                '<div class="folder-icon"><i class="fa-solid ' + f.icon + '"></i></div>' +
                '<div class="folder-text">' +
                  '<h3>' + f.label + '</h3>' +
                  '<p>' + f.talents.length + ' CVs available</p>' +
                '</div>' +
              '</div>' +
              '<div style="display:-webkit-flex; display:flex; align-items:center;">' +
                '<span class="count-badge">' + f.talents.length + '</span>' +
                '<i class="fa-solid fa-chevron-right" style="font-size:12px; opacity:0.4;"></i>' +
              '</div>';

            grid.appendChild(btn);
          }
        } else {
          secDiv.className = "hidden";
        }
      }

      var emptyState = document.getElementById("emptyState");
      if (visibleTotal === 0 && q !== "") {
        emptyState.className = "center-box";
      } else {
        emptyState.className = "center-box hidden";
      }
    }

    function handleSearch() {
      renderFolders();
    }

    function openCVViewer(folder) {
      document.getElementById("viewerTitle").innerText = folder.label;
      document.getElementById("viewerBadge").innerText = folder.talents.length + " CVs";
      var container = document.getElementById("viewerSlidesContainer");
      container.innerHTML = "";

      if (folder.talents.length === 0) {
        container.innerHTML = '<div class="center-box" style="width:100%;">No CVs in this folder.</div>';
      } else {
        for (var i = 0; i < folder.talents.length; i++) {
          var t = folder.talents[i];
          var slide = document.createElement("div");
          slide.className = "cv-slide";

          var imgHtml = t.cv 
            ? '<img src="' + t.cv + '" alt="CV" />' 
            : '<div style="color:rgba(255,255,255,0.4); font-size:12px;">No CV Image Available</div>';

          var openBtn = t.cv 
            ? '<a href="' + t.cv + '" target="_blank" class="open-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Original</a>' 
            : '';

          slide.innerHTML = 
            '<div class="cv-frame">' +
              imgHtml +
              '<span class="counter-tag">' + (i + 1) + ' / ' + folder.talents.length + '</span>' +
              openBtn +
            '</div>' +
            '<div style="margin-top: 10px;">' +
              '<p style="font-weight: 600; font-size: 14px;">' + (t.name || 'Unnamed Candidate') + '</p>' +
              '<p style="font-size: 12px; color: rgba(255,255,255,0.5); margin-top:2px;">' +
                (t.job || 'N/A') + ' • ' + (t.experience || 'N/A') + ' • ' + (t.country || 'N/A') +
              '</p>' +
            '</div>';

          container.appendChild(slide);
        }
      }

      var modal = document.getElementById("cvViewerModal");
      modal.style.display = "-webkit-flex";
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeCVViewer() {
      var modal = document.getElementById("cvViewerModal");
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    }

    window.onload = loadData;
  </script>
</body>
</html>
