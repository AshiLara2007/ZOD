<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZOD Manpower CV System</title>

  <style>
    /* ================= GLOBAL RESETS & FALLBACKS ================= */
    * {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html, body {
      background-color: #0f172a !important;
      color: #ffffff !important;
      min-height: 100%;
      width: 100%;
      -webkit-text-size-adjust: 100%;
    }

    /* ================= HEADER STYLES ================= */
    .header-bar {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 16px;
    }
    .header-inner {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header-top {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .logo-container {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-color: #007aff;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-right: 12px;
    }
    .logo-icon svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    .title-main {
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      line-height: 1.2;
    }
    .title-sub {
      font-size: 12px;
      color: #94a3b8;
    }
    .badge-count {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* Search Box */
    .search-wrap {
      position: relative;
      width: 100%;
    }
    .search-input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px 12px 42px;
      font-size: 14px;
      color: #ffffff;
      outline: none;
    }
    .search-icon-svg {
      position: absolute;
      left: 14px;
      top: 12px;
      width: 18px;
      height: 18px;
      fill: #94a3b8;
    }

    /* ================= MAIN CONTAINER ================= */
    .main-content {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px 60px 16px;
    }
    .section-head {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      margin-top: 20px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-right: 10px;
    }
    .section-line {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      height: 1px;
      background-color: #1e293b;
    }

    /* Grid Layout for Old iOS */
    .folder-grid {
      width: 100%;
      font-size: 0;
    }
    .folder-card-wrap {
      display: inline-block;
      vertical-align: top;
      width: 100%;
      padding-bottom: 12px;
      font-size: 14px;
    }
    @media (min-width: 600px) {
      .folder-card-wrap {
        width: 50%;
        padding-right: 6px;
      }
      .folder-card-wrap:nth-child(even) {
        padding-right: 0;
        padding-left: 6px;
      }
    }
    @media (min-width: 900px) {
      .folder-card-wrap {
        width: 33.333%;
        padding-right: 8px;
        padding-left: 0;
      }
      .folder-card-wrap:nth-child(even) {
        padding-right: 8px;
        padding-left: 0;
      }
    }

    .folder-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .folder-card:active {
      background-color: #334155;
    }
    .card-left {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      overflow: hidden;
    }
    .folder-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background-color: rgba(0, 122, 255, 0.2);
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      margin-right: 12px;
      -webkit-shrink: 0;
      flex-shrink: 0;
    }
    .folder-avatar svg {
      width: 20px;
      height: 20px;
      fill: #007aff;
    }
    .card-title {
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 2px;
    }
    .num-pill {
      background-color: #007aff;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* ================= MODAL VIEWER ================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1000;
      background-color: #0f172a;
      display: none;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
    }
    .modal-nav {
      height: 56px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 16px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }
    .btn-back {
      background-color: #334155;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-title {
      font-weight: bold;
      font-size: 15px;
      color: #ffffff;
    }

    /* Gallery Slider */
    .gallery-container {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
      white-space: nowrap;
      font-size: 0;
    }
    .cv-slide-box {
      display: inline-block;
      vertical-align: top;
      width: 85%;
      max-width: 600px;
      height: 100%;
      margin-right: 16px;
      white-space: normal;
      font-size: 14px;
    }
    .cv-image-frame {
      position: relative;
      width: 100%;
      height: calc(100% - 50px);
      background-color: #000000;
      border-radius: 12px;
      border: 1px solid #334155;
      overflow: hidden;
      text-align: center;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }
    .cv-image-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    .tag-counter {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.85);
      color: #ffffff;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 10px;
      z-index: 10;
    }
    .btn-open-link {
      position: absolute;
      top: 10px; left: 10px;
      background: #007aff;
      color: #ffffff;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      z-index: 10;
    }

    .img-error-box {
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    /* Utility */
    .hidden { display: none !important; }
    .status-msg { text-align: center; padding: 50px 16px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <div class="header-bar">
    <div class="header-inner">
      <div class="header-top">
        <div class="logo-container">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
          <div>
            <div class="title-main">ZOD Manpower CV System</div>
            <div class="title-sub">Candidate CV Viewer Portal</div>
          </div>
        </div>
        <div id="totalBadge" class="badge-count hidden">
          <span id="totalCount">0</span> CVs
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input
          type="text"
          id="searchInput"
          onkeyup="filterFolders()"
          oninput="filterFolders()"
          placeholder="Search folders (role, country, type)..."
          class="search-input"
        />
      </div>
    </div>
  </div>

  <!-- ================= MAIN BODY ================= -->
  <div class="main-content">
    <div id="loadingState" class="status-msg">
      Loading Candidates & Data...
    </div>

    <div id="errorState" class="status-msg hidden" style="color: #f87171;">
      <span id="errorText">Error loading data.</span>
    </div>

    <div id="emptyState" class="status-msg hidden">
      No folders match your search query.
    </div>

    <div id="sectionsContainer" class="hidden">
      <!-- Housemaid Types -->
      <div id="sec-housemaid">
        <div class="section-head">
          <span class="section-title">Housemaid Types</span>
          <div class="section-line"></div>
        </div>
        <div id="grid-housemaid" class="folder-grid"></div>
      </div>

      <!-- Job Roles -->
      <div id="sec-jobs">
        <div class="section-head">
          <span class="section-title">Job Roles</span>
          <div class="section-line"></div>
        </div>
        <div id="grid-jobs" class="folder-grid"></div>
      </div>

      <!-- Countries -->
      <div id="sec-countries">
        <div class="section-head">
          <span class="section-title">Countries</span>
          <div class="section-line"></div>
        </div>
        <div id="grid-countries" class="folder-grid"></div>
      </div>
    </div>
  </div>

  <!-- ================= CV VIEWER MODAL ================= -->
  <div id="cvModal" class="modal-overlay">
    <div class="modal-nav">
      <button onclick="closeModal()" class="btn-back">← Back</button>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBadge" class="num-pill">0</div>
    </div>

    <div id="slidesViewport" class="gallery-container">
      <!-- Slides loaded here -->
    </div>
  </div>

  <!-- ================= JAVASCRIPT FOR OLD IPAD CV FIX ================= -->
  <script>
    var SUPABASE_URL = "https://ksyxmoqzcghszrhlpaxh.supabase.co"; 
    var SUPABASE_KEY = "sb_publishable_U289_qf4pkGHp-G1C4kX5w_2bztcmOg";

    var JOB_LABELS = {
      "House Maid": "Housemaid",
      "Baby sitting": "Baby Sitter",
      "Domestic Worker": "Domestic Worker",
      "Driver": "Driver",
      "Cook": "Cook",
      "Nurse": "Nurse"
    };

    var SVG_FOLDER = '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
    var SVG_BRIEFCASE = '<svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>';
    var SVG_GLOBE = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>';

    var talents = [];

    // Safe Data Loader with Cross-Origin Compatibility
    function initData() {
      var xhr = new XMLHttpRequest();
      var reqUrl = SUPABASE_URL + "/rest/v1/talents?select=*&order=created_at.desc";
      
      xhr.open("GET", reqUrl, true);
      xhr.setRequestHeader("apikey", SUPABASE_KEY);
      xhr.setRequestHeader("Authorization", "Bearer " + SUPABASE_KEY);

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var responseData = JSON.parse(xhr.responseText);
              talents = responseData || [];
              
              document.getElementById("loadingState").className += " hidden";
              document.getElementById("totalCount").innerText = talents.length;
              document.getElementById("totalBadge").className = "badge-count";
              document.getElementById("sectionsContainer").className = "";
              filterFolders();
            } catch(e) {
              showError("JSON Parse Error: " + e.message);
            }
          } else {
            showError("Database Error: Code " + xhr.status);
          }
        }
      };

      xhr.onerror = function() {
        showError("Connection Failed. Check internet or SSL settings.");
      };

      xhr.send();
    }

    function showError(msg) {
      document.getElementById("loadingState").className += " hidden";
      document.getElementById("errorText").innerText = msg;
      document.getElementById("errorState").className = "status-msg";
    }

    function getUniqueKeys(arr, key) {
      var map = {}, list = [];
      for(var i = 0; i < arr.length; i++) {
        var v = arr[i][key];
        if(v && !map[v]) {
          map[v] = true;
          list.push(v);
        }
      }
      return list.sort();
    }

    function filterFolders() {
      var q = document.getElementById("searchInput").value.toLowerCase().trim();

      var housemaids = [
        {
          label: "Recruitment Housemaids",
          icon: SVG_FOLDER,
          talents: talents.filter(function(t) { 
            var wType = t.workerType || t.workertype || t.worker_type || "";
            return wType === "Recruitment Workers"; 
          })
        },
        {
          label: "Returned Housemaids",
          icon: SVG_FOLDER,
          talents: talents.filter(function(t) { 
            var wType = t.workerType || t.workertype || t.worker_type || "";
            return wType === "Returned Housemaids"; 
          })
        }
      ];

      var jobs = getUniqueKeys(talents, 'job').map(function(j) {
        return {
          label: JOB_LABELS[j] || j,
          icon: SVG_BRIEFCASE,
          talents: talents.filter(function(t) { return t.job === j; })
        };
      });

      var countries = getUniqueKeys(talents, 'country').map(function(c) {
        return {
          label: c,
          icon: SVG_GLOBE,
          talents: talents.filter(function(t) { return t.country === c; })
        };
      });

      var sections = [
        { id: "housemaid", data: housemaids },
        { id: "jobs", data: jobs },
        { id: "countries", data: countries }
      ];

      var totalFound = 0;

      for (var s = 0; s < sections.length; s++) {
        var sec = sections[s];
        var grid = document.getElementById("grid-" + sec.id);
        var secDiv = document.getElementById("sec-" + sec.id);
        grid.innerHTML = "";

        var matches = sec.data.filter(function(item) {
          return item.label.toLowerCase().indexOf(q) !== -1;
        });

        if (matches.length > 0) {
          secDiv.className = "";
          totalFound += matches.length;

          for (var k = 0; k < matches.length; k++) {
            var item = matches[k];
            var wrap = document.createElement("div");
            wrap.className = "folder-card-wrap";

            var card = document.createElement("div");
            card.className = "folder-card";
            card.onclick = (function(folderObj) {
              return function() { openModal(folderObj); };
            })(item);

            card.innerHTML = 
              '<div class="card-left">' +
                '<div class="folder-avatar">' + item.icon + '</div>' +
                '<div>' +
                  '<div class="card-title">' + item.label + '</div>' +
                  '<div class="card-sub">' + item.talents.length + ' CVs Available</div>' +
                '</div>' +
              '</div>' +
              '<div class="num-pill">' + item.talents.length + '</div>';

            wrap.appendChild(card);
            grid.appendChild(wrap);
          }
        } else {
          secDiv.className = "hidden";
        }
      }

      var empty = document.getElementById("emptyState");
      if (totalFound === 0 && q !== "") {
        empty.className = "status-msg";
      } else {
        empty.className = "status-msg hidden";
      }
    }

    // Modal with Safe Image Loader
    function openModal(folder) {
      document.getElementById("modalTitle").innerText = folder.label;
      document.getElementById("modalBadge").innerText = folder.talents.length + " CVs";
      var vp = document.getElementById("slidesViewport");
      vp.innerHTML = "";

      if (folder.talents.length === 0) {
        vp.innerHTML = '<div class="status-msg">No CVs found in this folder</div>';
      } else {
        for (var i = 0; i < folder.talents.length; i++) {
          var c = folder.talents[i];
          
          // Fallback for CV URL column naming (cv / cv_url / cvUrl)
          var cvUrl = c.cv || c.cv_url || c.cvUrl || "";

          var slide = document.createElement("div");
          slide.className = "cv-slide-box";

          var imgHtml = "";
          var linkHtml = "";

          if (cvUrl !== "") {
            imgHtml = '<img src="' + cvUrl + '" alt="CV" onerror="this.onerror=null; this.parentNode.innerHTML=\'<div class=\\\’img-error-box\\\’>Unable to display image preview on Old iPad Safari.<br><br><a href=\\\'' + cvUrl + '\\\’ target=\\\'_blank\\\’ style=\\\’color:#007aff; font-weight:bold;\\\’>Click here to view original CV</a></div>\';" />';
            linkHtml = '<a href="' + cvUrl + '" target="_blank" class="btn-open-link">Open Original</a>';
          } else {
            imgHtml = '<div class="img-error-box">No CV Image URL attached</div>';
          }

          var nameText = c.name || c.candidate_name || 'Unnamed Candidate';
          var jobText = c.job || c.job_role || 'N/A';
          var expText = c.experience || c.exp || 'N/A';
          var countryText = c.country || 'N/A';

          slide.innerHTML = 
            '<div class="cv-image-frame">' +
              imgHtml +
              '<span class="tag-counter">' + (i + 1) + ' / ' + folder.talents.length + '</span>' +
              linkHtml +
            '</div>' +
            '<div style="margin-top:8px;">' +
              '<div style="color:#ffffff; font-weight:bold; font-size:14px;">' + nameText + '</div>' +
              '<div style="color:#94a3b8; font-size:12px; margin-top:2px;">' + jobText + ' • Exp: ' + expText + ' • ' + countryText + '</div>' +
            '</div>';

          vp.appendChild(slide);
        }
      }

      var modal = document.getElementById("cvModal");
      modal.style.display = "-webkit-flex";
      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("cvModal").style.display = "none";
    }

    window.onload = initData;
  </script>
</body>
</html>
